<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="description" content="Fronteira in Concert — 10ª edición. 8–11 octubre 2026, Bernardo de Irigoyen, Misiones." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Fronteira" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/icon-512.png" />
  <title>Fronteira in Concert</title>
  <link rel="stylesheet" href="/styles.css?v=124" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img class="brand-mark-img" src="/uploads/logo-fronteira-x.png" alt="" width="44" height="34" />
      <div>
        <strong id="brand-name">Fronteira in Concert</strong>
        <span id="brand-edicion" class="muted">10ª edición</span>
      </div>
    </div>
  </header>

  <main id="app" class="app solo-apoyan">
    <section id="inicio" class="panel active" data-panel="inicio">
      <div class="hero">
        <div class="hero-video-row" id="hero-video-row" hidden>
          <span class="hero-year" aria-hidden="true">2016</span>
          <div class="hero-video-wrap" id="hero-video-wrap">
            <video id="hero-video" class="hero-video" muted playsinline loop autoplay preload="auto"></video>
          </div>
          <span class="hero-year" aria-hidden="true">2026</span>
        </div>
        <img id="hero-logo" class="hero-logo" alt="Logo del festival" hidden />
        <p class="eyebrow" id="hero-edicion">10ª edición</p>
        <h1 id="hero-nombre">Fronteira in Concert</h1>
        <p class="hero-meta" id="hero-fechas">8–11 de octubre de 2026</p>
        <p class="hero-meta" id="hero-lugar">Bernardo de Irigoyen, Misiones</p>
        <p class="blurb" id="hero-blurb"></p>
        <p class="org muted" id="hero-org"></p>
      </div>
      <div class="hasta-2027">
        <p class="h27-es">Nos vemos en Septiembre del 2027</p>
        <p class="h27-pt">Nos vemos em setembro de 2027</p>
      </div>
      <button type="button" class="btn gold full becas-btn" id="becas-btn">
        <span class="becas-es">Ganadores Becas 2027</span>
        <span class="becas-pt">Ganhadores Bolsas 2027</span>
      </button>
    </section>

    <section id="apoyan" class="panel active" data-panel="apoyan">
      <h2>Quiénes apoyan</h2>
      <div id="apoyan-grid" class="apoyan-groups"></div>
    </section>
    <section id="becas" class="panel" data-panel="becas">
      <button type="button" class="btn outline becas-volver" id="becas-volver">← Volver / Voltar</button>
      <h2 class="becas-title"><span>Ganadores Becas 2027</span><span class="becas-title-pt">Ganhadores Bolsas 2027</span></h2>
      <div id="becas-body" class="becas-body">
        <p class="becas-pronto">Próximamente / Em breve</p>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" hidden></div>
  <script src="/app.js?v=119" defer></script>
</body>
</html>
